<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Study Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js"></script>
</head>
<body th:attr="data-room=${roomId}">
<div class="container mt-4">
    <h1 class="text-center">Study Room: <span th:text="${roomId}">room</span></h1>

    <div class="row">
        <div class="col-md-3">
            <h5>Online <span id="memberCount" class="badge bg-secondary">0</span></h5>
            <ul id="members" class="list-group mb-3"></ul>

            <div class="card p-3">
                <h5 id="timer">Idle</h5>
                <div class="d-flex gap-2 mt-2">
                    <button id="startTimer" class="btn btn-success btn-sm">Start 25</button>
                    <button id="stopTimer" class="btn btn-outline-danger btn-sm">Stop</button>
                </div>
            </div>
        </div>

        <div class="col-md-9">
            <div id="chat" class="border rounded p-3 mb-3" style="height: 400px; overflow-y: auto;"></div>
            <div class="input-group">
                <input id="messageInput" type="text" class="form-control" placeholder="Type a message...">
                <button id="sendMessage" class="btn btn-primary">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
let stompClient, roomId, myName;

function showMessage(m) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'border-bottom mb-1 pb-1';
    div.textContent = m.sender + ': ' + m.content;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function renderMembers(list) {
    document.getElementById('memberCount').textContent = list.length;
    const ul = document.getElementById('members');
    ul.innerHTML = '';
    list.forEach(name => {
        const li = document.createElement('li');
        li.className = 'list-group-item';
        li.textContent = name;
        ul.appendChild(li);
    });
}

function renderTimer(t) {
    clearInterval(window.timerTick);
    const el = document.getElementById('timer');
    if (!t.running) { el.textContent = 'Idle'; return; }

    const tick = () => {
        const left = Math.max(0, Math.round((new Date(t.endsAt) - Date.now()) / 1000));
        const mm = String(Math.floor(left / 60)).padStart(2, '0');
        const ss = String(left % 60).padStart(2, '0');
        el.textContent = t.phase + ' ' + mm + ':' + ss;
    };
    tick();
    window.timerTick = setInterval(tick, 1000);
}

function connect() {
    const socket = new SockJS('/chat');
    stompClient = Stomp.over(socket);
    stompClient.debug = null;

    stompClient.connect({}, () => {
        const base = '/topic/room/' + roomId;
        stompClient.subscribe(base + '/chat', msg => showMessage(JSON.parse(msg.body)));
        stompClient.subscribe(base + '/presence', msg => renderMembers(JSON.parse(msg.body).members));
        stompClient.subscribe(base + '/timer', msg => renderTimer(JSON.parse(msg.body)));
        stompClient.send('/app/room/' + roomId + '/join', {}, JSON.stringify({ name: myName }));
    });
}

function sendMessage() {
    const input = document.getElementById('messageInput');
    if (!input.value.trim()) return;
    stompClient.send('/app/room/' + roomId + '/chat', {},
        JSON.stringify({ sender: myName, content: input.value }));
    input.value = '';
}

window.onload = () => {
    roomId = document.body.dataset.room;
    myName = prompt('Your name?') || 'anon';
    connect();

    document.getElementById('sendMessage').onclick = sendMessage;
    document.getElementById('messageInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') sendMessage();
    });
    document.getElementById('startTimer').onclick = () =>
        stompClient.send('/app/room/' + roomId + '/timer/start', {}, JSON.stringify({ minutes: 25 }));
    document.getElementById('stopTimer').onclick = () =>
        stompClient.send('/app/room/' + roomId + '/timer/stop', {}, '{}');
};
</script>
</body>
</html>
